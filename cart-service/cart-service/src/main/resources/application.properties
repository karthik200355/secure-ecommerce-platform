spring.application.name=cart-service

# Cart Service port - Product Service port 8082 ki conflict avvakunda
server.port = 8083

#cart service database connection
spring.datasource.url = jdbc:mysql://localhost:3306/cart_db

#mysql username
spring.datasource.username=root

#password
spring.datasource.password=${2003}

#java objects numchi database tables manage cheyataniki
spring.jpa.hibernate.ddl-auto=update

#sql queries console lodisplay avtaaniki
spring.jpa.show-sql = true

spring.jpa.properties.hibernate.formate_sql=true

