spring.application.name=notification-servcie

# Notification Service port - other services use different ports.
server.port=8086

# Connect Spring Boot to the notification database.
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db

# MySQL username.
spring.datasource.username=root

# Read the password from an environment variable for safety.
spring.datasource.password=2003

# MySQL JDBC driver.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically create/update tables from JPA entities during development.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console while learning and debugging.
spring.jpa.show-sql=true