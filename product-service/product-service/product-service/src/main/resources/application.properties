spring.application.name=product-service

#product services runs on port 8082 
server.port = 8082

#mysql connection for the product database

spring.datasource.url = jdbc:mysql://localhost:3306/product_db
spring.datasource.username = root
spring.datasource.password =${2003}

#jpa and hibernate configuration 
#automatic create/update tables based on entirt clases

spring.jpa.hibernate.ddl-auto =update

#dispaly sql queries in the terminal for learning/debugging
spring.jpa.show-sql = true

#uses mysql-specific sql rules Dialect ante enti? Simple ga cheppalante, database tho communicate cheyadaniki SQL rules ni specify chese configuration.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#MySQL Dialect
#MySQL ki suitable ga SQL generate cheyadaniki Hibernate ki help chestundi.